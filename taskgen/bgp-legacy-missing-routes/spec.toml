id = "bgp-legacy-missing-routes"
tier = 1
root_cause = "unchecked-precondition"
origin = "incident-transplant"
language = "go"
substrate = "gobgp"
inspired_by = "Probe sized to link MTU, not path MTU (fails only across the tunnel), transplanted into new BGP egress tagging code"
summary = "Egress tags are stamped on UPDATEs after they are packed to the size limit, so full UPDATEs to peers without extended messages overflow and are silently dropped."
starter_fails_on = ["TestEgressUpdatesFitLegacyPeer", "TestEgressUpdatesManyTags"]
extra_runs = ["-run '^(TestEgress|TestSessionOptions)' ./pkg/server/"]

[limits]
agent_timeout_sec = 2400

