# ---------------------------------------------------------------- the bug: tags stamped after packing
[[bug]]
file = "pkg/server/egress_tag.go"
old = '''// egressUpdates builds the UPDATEs sent to one neighbor: the advertised paths carry the neighbor's
// egress tags, and the RIB paths are left untouched.
func egressUpdates(paths []*table.Path, tags []*bgp.LargeCommunity, options *bgp.MarshallingOption) []*bgp.BGPMessage {
	if len(tags) > 0 {
		paths = withEgressTags(paths, tags)
	}
	return table.CreateUpdateMsgFromPaths(paths, options)
}

// withEgressTags returns tagged copies of the advertised paths.
func withEgressTags(paths []*table.Path, tags []*bgp.LargeCommunity) []*table.Path {
	out := make([]*table.Path, 0, len(paths))
	for _, p := range paths {
		if p.IsWithdraw || p.IsEOR() {
			out = append(out, p)
			continue
		}
		c := p.Clone(false)
		c.SetLargeCommunities(append(p.GetLargeCommunities(), tags...), true)
		out = append(out, c)
	}
	return out
}'''
new = '''// egressUpdates builds the UPDATEs sent to one neighbor and stamps the neighbor's egress tags on
// the ones that advertise routes. Tagging the encoded messages leaves the RIB paths untouched.
func egressUpdates(paths []*table.Path, tags []*bgp.LargeCommunity, options *bgp.MarshallingOption) []*bgp.BGPMessage {
	msgs := table.CreateUpdateMsgFromPaths(paths, options)
	if len(tags) == 0 {
		return msgs
	}
	for _, m := range msgs {
		stampEgressTags(m.Body.(*bgp.BGPUpdate), tags)
	}
	return msgs
}

// stampEgressTags adds tags to an UPDATE that advertises routes. The attribute list is rebuilt rather
// than edited in place, because packed UPDATEs share attribute values with the RIB paths.
func stampEgressTags(u *bgp.BGPUpdate, tags []*bgp.LargeCommunity) {
	advertises := len(u.NLRI) > 0
	attrs := make([]bgp.PathAttributeInterface, 0, len(u.PathAttributes)+1)
	var cs []*bgp.LargeCommunity
	for _, a := range u.PathAttributes {
		switch a := a.(type) {
		case *bgp.PathAttributeLargeCommunities:
			cs = append(cs, a.Values...)
			continue
		case *bgp.PathAttributeMpReachNLRI:
			advertises = true
		}
		attrs = append(attrs, a)
	}
	if !advertises {
		return
	}
	u.PathAttributes = append(attrs, bgp.NewPathAttributeLargeCommunities(append(cs, tags...)))
}'''

# ---------------------------------------------------------------- a different valid fix
[[alternative]]
name = "split-after-stamping"
[[alternative.edit]]
file = "pkg/server/egress_tag.go"
old = '''	for _, m := range msgs {
		stampEgressTags(m.Body.(*bgp.BGPUpdate), tags)
	}
	return msgs
}'''
new = '''	limit := bgp.MaxMessageLength(bgp.BGP_MSG_UPDATE, options)
	out := make([]*bgp.BGPMessage, 0, len(msgs))
	var fit func(u *bgp.BGPUpdate)
	fit = func(u *bgp.BGPUpdate) {
		b, err := u.Serialize(options)
		if (err != nil || bgp.BGP_HEADER_LENGTH+len(b) > limit) && len(u.NLRI) > 1 {
			h := len(u.NLRI) / 2
			fit(&bgp.BGPUpdate{WithdrawnRoutes: u.WithdrawnRoutes, PathAttributes: u.PathAttributes, NLRI: u.NLRI[:h]})
			fit(&bgp.BGPUpdate{PathAttributes: u.PathAttributes, NLRI: u.NLRI[h:]})
			return
		}
		out = append(out, &bgp.BGPMessage{Header: bgp.BGPHeader{Type: bgp.BGP_MSG_UPDATE}, Body: u})
	}
	for _, m := range msgs {
		u := m.Body.(*bgp.BGPUpdate)
		stampEgressTags(u, tags)
		fit(u)
	}
	return out
}'''

# ---------------------------------------------------------------- plausible wrong fixes
[[control]]
name = "never-extended"
comment = "Blames extended messages and turns them off; legacy peers still get overflowing UPDATEs"
expect = ["TestEgressUpdatesFitLegacyPeer"]
[[control.edit]]
file = "pkg/server/fsm.go"
old = '''	_, extended := capMap[bgp.BGP_CAP_EXTENDED_MESSAGE]'''
new = '''	extended := false'''

[[control]]
name = "fixed-margin"
comment = "Reserves room for exactly one large community in the packer; more tags still overflow"
expect = ["TestEgressUpdatesManyTags"]
[[control.edit]]
file = "internal/pkg/table/message.go"
old = '''		return (bgp.MaxMessageLength(bgp.BGP_MSG_UPDATE, options...) - (19 + 2 + 2 + attrsLen)) / (5 + addpathNLRILen)'''
new = '''		return (bgp.MaxMessageLength(bgp.BGP_MSG_UPDATE, options...) - (19 + 2 + 2 + 15 + attrsLen)) / (5 + addpathNLRILen)'''

[[control]]
name = "tag-the-rib"
comment = "Tags the paths before packing, but edits the shared RIB paths in place"
expect = ["TestEgressTagsLeaveRIBUntouched"]
[[control.edit]]
file = "pkg/server/egress_tag.go"
old = '''	msgs := table.CreateUpdateMsgFromPaths(paths, options)
	if len(tags) == 0 {
		return msgs
	}
	for _, m := range msgs {
		stampEgressTags(m.Body.(*bgp.BGPUpdate), tags)
	}
	return msgs'''
new = '''	for _, p := range paths {
		if len(tags) > 0 && !p.IsWithdraw && !p.IsEOR() {
			p.SetLargeCommunities(tags, false)
		}
	}
	return table.CreateUpdateMsgFromPaths(paths, options)'''

[[control]]
name = "skip-tag-when-full"
comment = "Leaves the tag off any UPDATE it would push over the limit"
expect = ["TestEgressUpdatesFitLegacyPeer"]
[[control.edit]]
file = "pkg/server/egress_tag.go"
old = '''	for _, m := range msgs {
		stampEgressTags(m.Body.(*bgp.BGPUpdate), tags)
	}
	return msgs'''
new = '''	limit := bgp.MaxMessageLength(bgp.BGP_MSG_UPDATE, options)
	for _, m := range msgs {
		u := m.Body.(*bgp.BGPUpdate)
		orig := u.PathAttributes
		stampEgressTags(u, tags)
		if b, err := u.Serialize(options); err != nil || bgp.BGP_HEADER_LENGTH+len(b) > limit {
			u.PathAttributes = orig
		}
	}
	return msgs'''
