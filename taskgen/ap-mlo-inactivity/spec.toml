# ---------------------------------------------------------------- the latent bug (present since 23.0)
[[bug]]
file = "internal/drv/drv.go"
old = '''	mld, mlo := d.mld[addr]
	d.mu.Unlock()
	key, typ := addr, dp.LinkPeer
	if mlo {
		key, typ = mld, dp.MLDPeer // an MLO station's counters are kept on its MLD peer
	}
	secs, err := d.dp.InactiveSec(key, typ)'''
new = '''	_, mlo := d.mld[addr]
	d.mu.Unlock()
	typ := dp.LinkPeer
	if mlo {
		typ = dp.MLDPeer // an MLO station's counters are kept on its MLD peer
	}
	secs, err := d.dp.InactiveSec(addr, typ)'''

# ---------------------------------------------------------------- a different valid fix
[[alternative]]
name = "peer-for-helper"
[[alternative.edit]]
file = "internal/drv/drv.go"
old = '''	d.mu.Lock()
	_, mlo := d.mld[addr]
	d.mu.Unlock()
	typ := dp.LinkPeer
	if mlo {
		typ = dp.MLDPeer // an MLO station's counters are kept on its MLD peer
	}
	secs, err := d.dp.InactiveSec(addr, typ)'''
new = '''	secs, err := d.dp.InactiveSec(d.peerFor(addr))'''
[[alternative.edit]]
file = "internal/drv/drv.go"
old = '''// InactiveSec reports how long the station associated on addr has been idle.'''
new = '''// peerFor is the datapath peer that holds the counters of the station associated on addr.
func (d *Driver) peerFor(addr string) (string, dp.PeerType) {
	d.mu.Lock()
	defer d.mu.Unlock()
	if mld, ok := d.mld[addr]; ok {
		return mld, dp.MLDPeer
	}
	return addr, dp.LinkPeer
}

// InactiveSec reports how long the station associated on addr has been idle.'''

