id = "ap-mlo-inactivity"
tier = 2
root_cause = "regression-from-fix"
origin = "incident-transplant"
language = "go"
substrate = "apnet"
inspired_by = "MLO inactivity disconnects after a stale-station fix exposed an older link-vs-MLD lookup mismatch; the historical remedy (revert) restored the stale-station bug"
summary = "A fix that removes stations the driver no longer has exposes an older bug: MLO stations' activity is looked up by link address instead of MLD address, so active MLO clients are dropped every 900 s. Reverting the fix brings back the stale-station bug."
starter_fails_on = ["TestMLOActiveStationKept", "TestMLOAndSingleLinkTogether"]

[limits]
agent_timeout_sec = 2400

