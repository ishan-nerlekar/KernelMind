[[history]]
message = """station: drop stations the driver no longer has

A client that powers off or goes out of range without disassociating keeps
its station entry, because the inactivity check treated every driver error
as "try again later". Firmware has already deleted the peer, so the check
never succeeds and the entry is never removed. When the client comes back,
its association is refused as a duplicate and it cannot rejoin until the
AP is rebooted (#412).

The driver now reports ErrNoStation when the datapath has no peer for the
station, and the inactivity check removes such stations. Other driver
errors are still retried."""
date = "2026-10-02T11:47:00+05:30"
author = "Lena Fischer <lena.fischer@apnet.example>"
adds = ["internal/station/rejoin_test.go", "internal/drv/nostation_test.go"]
[[history.edit]]
file = "internal/drv/drv.go"
old = '''	// ErrDriver means a driver request failed.
	ErrDriver = errors.New("drv: driver request failed")
'''
new = '''	// ErrDriver means a driver request failed; the station may or may not still exist.
	ErrDriver = errors.New("drv: driver request failed")
	// ErrNoStation means the driver has no such station.
	ErrNoStation = errors.New("drv: no such station")
'''
