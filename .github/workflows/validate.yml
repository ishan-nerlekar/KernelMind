name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Structure and grading checks (Docker sandbox)
        run: kernelmind validate --backend docker --json validation.json
      - name: Oracle must score 100%
        run: kernelmind run --agent oracle --backend docker --run-id ci-oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: validation.json
