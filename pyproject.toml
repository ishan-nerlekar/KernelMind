[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelmind"
version = "0.1.0"
description = "A benchmark of systems debugging tasks for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agents = ["mini-swe-agent==2.4.6", "litellm[mcp]==1.108.0"]  # pinned: tested versions

[project.scripts]
kernelmind = "kernelmind.cli:main"

[tool.setuptools.packages.find]
include = ["kernelmind*"]
